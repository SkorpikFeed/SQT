name: CI Pipeline
on:
  pull_request:
    types: [opened, edited, reopened, synchronize, review_requested]
    branches:
      - develop

# Add permissions to allow workflow to comment on PRs and check status
permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -e .
      - name: Run tests with coverage
        run: |
          pytest --cov=src --cov-report=xml:coverage.xml --junitxml=report.xml
      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            coverage.xml
            report.xml
          retention-days: 1

  analysis:
    runs-on: ubuntu-latest
    needs: build
    # Only run on pull requests
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      - name: Download coverage reports
        uses: actions/download-artifact@v4
        with:
          name: coverage-reports
      - name: Count lines of code with Cloc
        run: |
          sudo apt-get install -y cloc
          cloc src/ > cloc-report.txt
          cat cloc-report.txt
      - name: Запуск flake8 через Reviewdog
        uses: reviewdog/action-flake8@v2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-pr-review
          level: error
          fail_on_error: false
      - name: Запуск Black через Reviewdog
        uses: reviewdog/action-black@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-pr-review
          level: info
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: "17"
          distribution: "temurin"
      - name: Run SonarQube analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          wget https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-4.8.0.2856-linux.zip
          unzip sonar-scanner-cli-4.8.0.2856-linux.zip
          # This ensures we're definitely using Java 17 with SonarScanner
          echo "Using Java version:"
          java -version
          echo "Java home is: $JAVA_HOME"

          # Remove bundled JRE to force using system Java
          rm -rf sonar-scanner-4.8.0.2856-linux/jre

          # Modify the sonar-scanner script to find Java properly
          sed -i 's/use_embedded_jre=true/use_embedded_jre=false/g' sonar-scanner-4.8.0.2856-linux/bin/sonar-scanner

          # Make the explicit connection between sonar-scanner and the Java installation
          echo "sonar.scanner.java.home=$JAVA_HOME" >> sonar-scanner-4.8.0.2856-linux/conf/sonar-scanner.properties

          # List the coverage report to confirm it exists
          ls -la coverage.xml

          export PATH=$PATH:$(pwd)/sonar-scanner-4.8.0.2856-linux/bin
          sonar-scanner \
            -Dsonar.java.binaries=. \
            -Dsonar.python.coverage.reportPaths=coverage.xml

  review-check:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Перевірка наявності схваленого код-рев'ю
        uses: actions/github-script@v6
        with:
          script: |
            const prNumber = context.payload.pull_request.number;

